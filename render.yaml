services:
  - type: web
    name: silent-a45s-commerce
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: true
      - key: SESSION_SECRET
        generateValue: true
